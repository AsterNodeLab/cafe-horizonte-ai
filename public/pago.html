<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Café Horizonte · Confirmación de pago</title>
    <meta
      name="description"
      content="Confirmación del pago en Café Horizonte."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .pago-contenedor {
        max-width: 560px;
        justify-content: center;
        align-items: center;
      }

      .pago-tarjeta {
        width: 100%;
        padding: 40px 36px;
        text-align: center;
      }

      .marca {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--acc);
      }

      .marca svg {
        width: 26px;
        height: 26px;
      }

      .marca .etiqueta {
        color: var(--acc);
      }

      .sello {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 76px;
        margin: 28px auto 20px;
        border: 1px solid;
        border-radius: 50%;
      }

      .sello svg {
        width: 34px;
        height: 34px;
      }

      .sello--ok {
        color: var(--ok);
        background: rgba(63, 125, 91, 0.1);
        border-color: rgba(63, 125, 91, 0.32);
      }

      .sello--cancelado {
        color: var(--err);
        background: rgba(176, 74, 58, 0.09);
        border-color: rgba(176, 74, 58, 0.3);
      }

      .sello--demo {
        color: var(--acc);
        background: rgba(165, 101, 47, 0.1);
        border-color: rgba(165, 101, 47, 0.32);
      }

      .estado-titulo {
        margin: 0;
        font-family: var(--serif);
        font-size: 30px;
        font-weight: 400;
        line-height: 1.2;
        color: var(--ink);
      }

      .estado-detalle {
        max-width: 40ch;
        margin: 12px auto 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--mute);
      }

      .detalles {
        margin: 28px 0 24px;
        padding: 18px 0 4px;
        border-top: 1px solid var(--line);
        text-align: left;
      }

      .detalles div {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        padding-bottom: 12px;
      }

      .detalles dt {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .detalles dd {
        margin: 0;
        font-size: 13px;
        overflow-wrap: anywhere;
        color: var(--soft);
      }

      #d-monto {
        font-family: var(--mono);
        color: var(--ink);
      }

      .btn svg {
        width: 15px;
        height: 15px;
      }

      @media (max-width: 520px) {
        .pago-tarjeta {
          padding: 28px 20px;
        }

        .estado-titulo {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="fondo" aria-hidden="true"></div>

    <div class="contenedor pago-contenedor">
      <main class="tarjeta pago-tarjeta" aria-labelledby="estado-texto">
        <div class="marca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8Z" />
            <path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17" />
            <path d="M8 3c0 1-1 1.5-1 2.5M12 3c0 1-1 1.5-1 2.5" />
          </svg>
          <p class="etiqueta">CAFÉ HORIZONTE</p>
        </div>

        <div id="icono-estado" class="sello sello--demo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <g id="ico-ok" style="display: none">
              <circle cx="12" cy="12" r="9" />
              <path d="m8 12 3 3 5-6" />
            </g>
            <g id="ico-cancelado" style="display: none">
              <circle cx="12" cy="12" r="9" />
              <path d="m9 9 6 6M15 9l-6 6" />
            </g>
            <g id="ico-demo">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5M12 8h.01" />
            </g>
          </svg>
        </div>

        <h1 id="estado-texto" class="estado-titulo">Pago en demostración · sin cargo real</h1>
        <p id="estado-detalle" class="estado-detalle" role="status">
          Esta sesión es de prueba: no se procesó ningún cobro.
        </p>

        <dl class="detalles">
          <div>
            <dt>Concepto</dt>
            <dd id="d-concepto">—</dd>
          </div>
          <div>
            <dt>Monto</dt>
            <dd id="d-monto">—</dd>
          </div>
        </dl>

        <a class="btn btn--primario btn--ancho" href="/dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5" />
            <path d="m11 6-6 6 6 6" />
          </svg>
          VOLVER AL DASHBOARD
        </a>
      </main>

      <footer class="pie">CAFÉ HORIZONTE · DATOS EN VIVO · DATOS FICTICIOS</footer>
    </div>

    <script>
      (function () {
        'use strict';

        const parametros = new URLSearchParams(window.location.search);
        const estado = (parametros.get('estado') || '').toLowerCase();
        const monto = parametros.get('monto');
        const concepto = parametros.get('concepto');

        const titulo = document.getElementById('estado-texto');
        const detalle = document.getElementById('estado-detalle');
        const sello = document.getElementById('icono-estado');

        function mostrarIcono(id) {
          ['ico-ok', 'ico-cancelado', 'ico-demo'].forEach((nombre) => {
            document.getElementById(nombre).style.display = nombre === id ? '' : 'none';
          });
        }

        if (estado === 'ok') {
          titulo.textContent = 'Pago confirmado';
          detalle.textContent = 'Tu pago se registró correctamente. Gracias por comprar en Café Horizonte.';
          sello.className = 'sello sello--ok';
          mostrarIcono('ico-ok');
        } else if (estado === 'cancelado') {
          titulo.textContent = 'Pago cancelado';
          detalle.textContent = 'No se realizó ningún cargo. Puedes intentar de nuevo cuando quieras.';
          sello.className = 'sello sello--cancelado';
          mostrarIcono('ico-cancelado');
        } else {
          titulo.textContent = 'Pago en demostración · sin cargo real';
          detalle.textContent = 'Esta sesión es de prueba: no se procesó ningún cobro. El cobro real se activa al configurar el proveedor de pagos.';
          sello.className = 'sello sello--demo';
          mostrarIcono('ico-demo');
        }

        const numeroMonto = Number(monto);
        document.getElementById('d-monto').textContent =
          monto && Number.isFinite(numeroMonto) && numeroMonto > 0
            ? '$' + numeroMonto.toLocaleString('es-MX', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
              })
            : '—';
        document.getElementById('d-concepto').textContent =
          concepto && concepto.trim() ? concepto.trim() : 'Pedido Café Horizonte';
      })();
    </script>
  </body>
</html>
